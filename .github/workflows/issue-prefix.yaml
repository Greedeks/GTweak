name: Auto Prefix Issues

on:
  issues:
    types: [opened, edited, labeled]

jobs:
  add-prefix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Add [BUG] prefix
        if: contains(github.event.issue.labels.*.name, 'bug') && !startsWith(github.event.issue.title, '[BUG]')
        run: gh issue edit "$ISSUE_URL" --title "[BUG] $ISSUE_TITLE"

      - name: Add [Feature] prefix
        if: contains(github.event.issue.labels.*.name, 'feature') && !startsWith(github.event.issue.title, '[Feature]')
        run: gh issue edit "$ISSUE_URL" --title "[Feature] $ISSUE_TITLE"

      - name: Add [Question] prefix
        if: contains(github.event.issue.labels.*.name, 'question') && !startsWith(github.event.issue.title, '[Question]')
        run: gh issue edit "$ISSUE_URL" --title "[Question] $ISSUE_TITLE"