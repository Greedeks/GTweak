name: Auto Prefix Issues

on:
  issues:
    types: [opened, edited]

jobs:
  add-prefix:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_URL: ${{ github.event.issue.html_url }}
      ISSUE_TITLE: ${{ github.event.issue.title }}
    steps:
      - name: Add [BUG] prefix
        if: contains(github.event.issue.labels.*.name, 'bug') && !startsWith(github.event.issue.title, '[BUG]')
        run: gh issue edit "$ISSUE_URL" --title "[BUG] $ISSUE_TITLE"

      - name: Add [IDEA] prefix
        if: contains(github.event.issue.labels.*.name, 'enhancement') && !startsWith(github.event.issue.title, '[IDEA]')
        run: gh issue edit "$ISSUE_URL" --title "[IDEA] $ISSUE_TITLE"